<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{font-family:Segoe UI,Arial,sans-serif;margin:8px;background:#fff}</style>
<script src="mermaid.min.js"></script>
</head><body>
<div id="out"></div>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'default', flowchart: { curve: 'basis', htmlLabels: true }, themeVariables: { fontFamily: 'Segoe UI, Arial, sans-serif', fontSize: '14px' } });
window.renderDiagram = async function (src) {
  try {
    const { svg } = await mermaid.render('d' + Date.now() + Math.floor(Math.random() * 1000), src);
    document.getElementById('out').innerHTML = svg;
    window.__lastSvg = svg;
    window.__status = 'OK';
  } catch (e) {
    window.__status = 'ERR: ' + e.message;
    window.__lastSvg = null;
  }
  return window.__status;
};
window.__ready = true;
</script>
</body></html>
